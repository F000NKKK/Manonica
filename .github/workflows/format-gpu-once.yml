name: Normalize GPU compute code
on:
  push:
    paths: ['.github/workflows/format-gpu-once.yml']
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format core, GPU adapter and Lab
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/manonica-compute-gpu/Cargo.toml --all
          cargo fmt --manifest-path apps/manonica-lab/Cargo.toml --all
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize standalone GPU accelerator and tests"
            git push origin HEAD:master
          fi
