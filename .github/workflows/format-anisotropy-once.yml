name: Format anisotropic transport
on:
  push:
    paths: ['.github/workflows/format-anisotropy-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/manonica-lab/Cargo.toml --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: format anisotropic conductivity and tests"
            git push origin HEAD:master
          fi
