[package]
name = "manonica-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Отдельная workspace для графического приложения: большой графический стек
# Meridian не должен замедлять CI библиотек и консольных экспериментов.
[workspace]
resolver = "3"

[dependencies]
manonica-core = { path = "../../crates/manonica-core" }
manonica-error = { path = "../../crates/manonica-error" }
manonica-physics = { path = "../../crates/manonica-physics" }
# Temporary Git pin until an SDK patch release includes Surface::enable_vsync.
# The package remains meridian-sdk 0.8.0; only its presentation API differs.
meridian-sdk = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "a50643f8b167ca57b6e48245f2fd0013e8711eaa" }
# Reusable, optional-in-production GPU acceleration crate.
manonica-compute-gpu = { path = "../../crates/manonica-compute-gpu" }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
font8x8 = "0.3"

# Bounded parameter expressions for physical/visual procedural constructions.
meval = "0.2"
