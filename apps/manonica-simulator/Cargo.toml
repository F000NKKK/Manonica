[package]
name = "manonica-simulator"
default-run = "manonica-simulator"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
manonica-core = { path = "../../crates/manonica-core" }
manonica-physics = { path = "../../crates/manonica-physics" }
manonica-control = { path = "../../crates/manonica-control" }
manonica-materials = { path = "../../crates/manonica-materials" }
manonica-simulation = { path = "../../crates/manonica-simulation" }

[features]
gpu = ["dep:manonica-compute-gpu"]

[dependencies.manonica-compute-gpu]
path = "../../crates/manonica-compute-gpu"
optional = true

[[bin]]
name = "gpu-transport"
path = "src/bin/gpu_transport.rs"
required-features = ["gpu"]

[[bin]]
name = "gpu-coupled"
path = "src/bin/gpu_coupled.rs"
required-features = ["gpu"]

[[bin]]
name = "gpu-mechanics"
path = "src/bin/gpu_mechanics.rs"
required-features = ["gpu"]
