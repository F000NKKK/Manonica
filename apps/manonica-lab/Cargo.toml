[package]
name = "manonica-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Отдельная workspace для графического приложения: большой графический стек
# Meridian не должен замедлять CI библиотек и консольных экспериментов.
[workspace]
resolver = "3"

[dependencies]
manonica-core = { path = "../../crates/manonica-core" }
manonica-error = { path = "../../crates/manonica-error" }
manonica-physics = { path = "../../crates/manonica-physics" }
meridian-sdk = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "d2002a767e1bf48f5f7ce7af982296743e40a89f" }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
tokio = { version = "1", features = ["rt-multi-thread"] }
