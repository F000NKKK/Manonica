# Отдельный демонстрационный опыт: физическая формула захватывает маноны
# из кольцевого облака. Никаких декоративных старых кругов.
name = "Формульная ловушка — захват манонов"

[grid]
dimensions = [28, 24, 28]
cell_size = 0.45

[physics]
diffusivity = 0.08
dt = 0.02
steps_per_frame = 1
thermal_conductance = 0.05
ambient_cooling_rate = 0.025

# Parametric geometry drives a real 3D potential, not just capture geometry.
# All sources below refer to the same formulas as the rendered constructions.
[physics.potential]
mobility = 0.1
permittivity = 1.0
screening = 0.8
boundary = "grounded"
iterations = 120
initial_work_joules = 20000.0
max_power_joules_per_second = 10000.0
shutdown_at_bound_fraction = 0.995
shutdown_decay_rate = 0.12

[visualization]
relative_threshold = 0.035
max_points = 1100
exposure = 2.4
optical_density = 0.22
wisps = true

# Исходный запас размещён вдоль будущей кольцевой ловушки.
[[seeds]]
shape = "ring"
center = [0.0, -0.45, 0.0]
normal = [0.0, 1.0, 0.0]
radius = 2.2
sigma = 0.38
total_manons = 12000.0

# Действующая магическая формула: замкнутый круг в горизонтальной плоскости.
[[formulas]]
name = "Поглощающий контур"
x = "2.2*cos(t)"
y = "-0.45"
z = "2.2*sin(t)"
segments = 96
thickness = 0.055
color = [0.15, 1.0, 0.45]

# Поглощение не создаёт новых манонов. FREE падает, BOUND растёт.
[formulas.trap]
capacity = 8000.0
capture_rate = 3.0
release_rate = 0.0
binding_energy = 0.08
heat_capacity = 100.0
reference_temperature = 300.0
activation_temperature = 300.0
max_flux = 3500.0

# Formula-linked sources are re-rasterized when geometry is edited.
[[field_sources]]
formula = 0
strength = -85.0
