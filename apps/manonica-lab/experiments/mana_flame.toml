# Начальные условия и геометрия. Списка заклинаний нет.
name = "Концентрация свободных манонов"

[grid]
dimensions = [28, 24, 28]
cell_size = 0.45

[physics]
diffusivity = 0.22
dt = 0.02
steps_per_frame = 1
ambient_cooling_rate = 0.025

# Parametric geometry drives a real 3D potential, not just capture geometry.
# All sources below refer to the same formulas as the rendered constructions.
[physics.potential]
mobility = 0.08
permittivity = 1.0
screening = 1
boundary = "grounded"
iterations = 120
initial_work_joules = 20000.0
max_power_joules_per_second = 10000.0
shutdown_at_bound_fraction = 0.995
shutdown_decay_rate = 0.12

[visualization]
relative_threshold = 0.075
max_points = 1100
exposure = 2.4
optical_density = 0.18
wisps = true

[[seeds]]
shape = "gaussian"
center = [0.0, 0.15, 0.0]
sigma = 0.75
total_manons = 9500.0

[[seeds]]
shape = "ring"
center = [0.0, -0.5, 0.0]
normal = [0.0, 1.0, 0.0]
radius = 1.95
sigma = 0.28
total_manons = 1800.0

# Physical geometric elements derive exclusively from parametric equations.
[[formulas]]
name = "Внешний формульный контур"
x = "2.15*cos(t)"
y = "-0.8"
z = "2.15*sin(t)"
segments = 128
thickness = 0.035
color = [0.25, 0.55, 1.0]

[formulas.trap]
capacity = 1800.0
capture_rate = 0.35
release_rate = 0.001
binding_energy = 0.08
heat_capacity = 90.0
reference_temperature = 300.0
activation_temperature = 300.0
max_flux = 250.0

[[formulas]]
name = "Внутренний формульный контур"
x = "1.35*cos(t)"
y = "-0.78"
z = "1.35*sin(t)"
segments = 96
thickness = 0.022
color = [0.55, 0.2, 1.0]

[formulas.trap]
capacity = 800.0
capture_rate = 0.25
release_rate = 0.002
binding_energy = 0.08
heat_capacity = 50.0
reference_temperature = 300.0
activation_temperature = 300.0
max_flux = 100.0

# Formula-linked sources are re-rasterized when geometry is edited.
[[field_sources]]
formula = 0
strength = -45.0

[[field_sources]]
formula = 1
strength = -30.0
