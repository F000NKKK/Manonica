name: Manonica Lab (Meridian SDK)

on:
  push:
    paths:
      - 'apps/manonica-lab/**'
      - 'apps/manonica-simulator/**'
      - 'Cargo.toml'
      - 'crates/manonica-core/**'
      - 'crates/manonica-physics/**'
      - 'crates/manonica-materials/**'
      - 'crates/manonica-simulation/**'
      - 'crates/manonica-compute-gpu/**'
      - 'crates/manonica-error/**'
      - '.github/workflows/lab.yml'
      - 'scripts/smoke_lab_x11.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Both independent Cargo workspaces reuse the same compiled Meridian dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/manonica-lab/target
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies for Meridian audio/window backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers xvfb xdotool xauth
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/manonica-lab
      - name: Check graphic app
        run: cargo check --manifest-path apps/manonica-lab/Cargo.toml
      - name: Test experiment invariants and procedural geometry
        run: cargo test --manifest-path apps/manonica-lab/Cargo.toml
      - name: Check automatic GPU-first policy and strict explicit selection
        run: cargo test --manifest-path apps/manonica-lab/Cargo.toml backend_policy::tests -- --nocapture
      - name: GPU compute parity tests (software Vulkan required)
        env:
          MANONICA_GPU_TEST: '1'
        run: cargo test --manifest-path crates/manonica-compute-gpu/Cargo.toml
      - name: Resident Lab integration and device reset
        run: cargo test --manifest-path apps/manonica-lab/Cargo.toml gpu_tests -- --ignored --nocapture
      - name: Dynamic mechanics GPU parity, reset and replacement
        run: cargo test --manifest-path apps/manonica-lab/Cargo.toml mechanical_gpu -- --ignored --nocapture
      - name: Headless coupled physics validation
        run: cargo run -p manonica-simulator --features gpu --bin gpu-coupled
      - name: Headless dynamic mechanics packet validation
        run: cargo run -p manonica-simulator --features gpu --bin gpu-mechanics -- --steps 100 --batch 10 --warmup 10 --label ci-software-vulkan
      - name: Headless resident transport experiment
        run: cargo run -p manonica-simulator --features gpu --bin gpu-transport
      - name: Build native Lab smoke target
        run: cargo build --manifest-path apps/manonica-lab/Cargo.toml
      - name: Native editor and graceful shutdown smoke
        run: xvfb-run -a python3 scripts/smoke_lab_x11.py "$CARGO_TARGET_DIR/debug/manonica-lab" apps/manonica-lab/experiments/local_boundary_conductor.toml
      - name: Check compute crate formatting
        run: cargo fmt --manifest-path crates/manonica-compute-gpu/Cargo.toml --all -- --check
