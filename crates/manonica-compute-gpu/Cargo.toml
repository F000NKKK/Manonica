[package]
name = "manonica-compute-gpu"
version = "0.1.0"
edition = "2024"
publish = false

# GPU compute is an optional accelerator, separate from the deterministic
# CPU physics workspace and from the graphical editor.
[workspace]
resolver = "3"

[dependencies]
manonica-core = { path = "../manonica-core" }
manonica-error = { path = "../manonica-error" }
manonica-physics = { path = "../manonica-physics" }
manonica-materials = { path = "../manonica-materials" }
manonica-simulation = { path = "../manonica-simulation" }
meridian-sdk = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "49c68a1c8570e2d4ca6255169209508ccea686e4" }
meridian-gpu-wgpu = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "49c68a1c8570e2d4ca6255169209508ccea686e4" }
tokio = { version = "1", features = ["rt-multi-thread"] }
