[package]
name = "manonica-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Отдельная workspace для графического приложения: большой графический стек
# Meridian не должен замедлять CI библиотек и консольных экспериментов.
[workspace]
resolver = "3"

[dependencies]
manonica-core = { path = "../../crates/manonica-core" }
manonica-error = { path = "../../crates/manonica-error" }
manonica-physics = { path = "../../crates/manonica-physics" }
meridian-sdk = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
font8x8 = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
