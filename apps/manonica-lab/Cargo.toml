[package]
name = "manonica-lab"
default-run = "manonica-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Отдельная workspace для графического приложения: большой графический стек
# Meridian не должен замедлять CI библиотек и консольных экспериментов.
[workspace]
resolver = "3"

[dependencies]
manonica-core = { path = "../../crates/manonica-core" }
manonica-error = { path = "../../crates/manonica-error" }
manonica-physics = { path = "../../crates/manonica-physics" }
manonica-materials = { path = "../../crates/manonica-materials" }
manonica-simulation = { path = "../../crates/manonica-simulation" }
# Git pin for FIFO presentation, graceful shutdown and persistent texture updates.
# The package remains meridian-sdk 0.8.0; only its presentation API differs.
meridian-sdk = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "49c68a1c8570e2d4ca6255169209508ccea686e4" }
# Reusable, optional-in-production GPU acceleration crate.
manonica-compute-gpu = { path = "../../crates/manonica-compute-gpu" }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
font8x8 = "0.3"
# Native clipboard for formula editor shortcuts (Ctrl+A/C/V).
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Bounded parameter expressions for physical/visual procedural constructions.
meval = "0.2"

manonica-world = { path = "../../crates/manonica-world" }

meridian-gpu-wgpu = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "49c68a1c8570e2d4ca6255169209508ccea686e4" }
