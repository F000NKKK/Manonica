name: Format physical model
on:
  push:
    paths:
      - '.github/workflows/format-physics-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format core and lab
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/manonica-lab/Cargo.toml --all
      - name: Commit canonical rustfmt output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt to physical model"
            git push origin HEAD:master
          fi
