[package]
name = "manonica-compute-gpu"
version = "0.1.0"
edition = "2024"
publish = false

# GPU compute is an optional accelerator, separate from the deterministic
# CPU physics workspace and from the graphical editor.
[workspace]
resolver = "3"

[dependencies]
manonica-core = { path = "../manonica-core" }
manonica-error = { path = "../manonica-error" }
manonica-physics = { path = "../manonica-physics" }
meridian-sdk = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "a50643f8b167ca57b6e48245f2fd0013e8711eaa" }
meridian-gpu-wgpu = { git = "https://github.com/F000NKKK/Meridian-Engine", rev = "a50643f8b167ca57b6e48245f2fd0013e8711eaa" }
tokio = { version = "1", features = ["rt-multi-thread"] }
